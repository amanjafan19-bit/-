<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حساباتی مەسرەف</title>
    
    <!-- بەستنەوە بە فایلی ئەپڵیکەیشن (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#16a34a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; padding: 15px; direction: rtl; margin: 0; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { color: #1e293b; margin: 5px 0; font-size: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input { padding: 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; outline: none; }
        input:focus { border-color: #16a34a; }
        button.add-btn { background: #16a34a; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button.add-btn:active { background: #15803d; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 12px 8px; text-align: center; font-size: 15px; }
        th { background: #f8fafc; color: #475569; }
        .total-box { margin-top: 25px; padding: 16px; background: #dcfce7; border-radius: 12px; font-size: 18px; font-weight: bold; color: #15803d; display: flex; justify-content: space-between; }
        .del-btn { background: #fee2e2; color: #dc2626; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🛠️ حساباتی نۆژەنکردنەوە</h2>
    </div>
    
    <div class="input-group">
        <input type="text" id="itemName" placeholder="ناوی مەسرەف (بۆ نموونە: تەختەی کاوانتەر)">
        <input type="number" id="itemPrice" placeholder="نرخ بە ژمارە (بۆ نموونە: 45000)">
        <button class="add-btn" onclick="addItem()">زیادکردن</button>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 10%;">#</th>
                <th style="width: 50%;">ناوی مەسرەف</th>
                <th style="width: 25%;">نرخ</th>
                <th style="width: 15%;">سڕینەوە</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <div class="total-box">
        <span>کۆی گشتی:</span>
        <span id="totalAmount">0</span>
    </div>
</div>

<script>
    // چالاککردنی دابەزاندنی ئەپ (PWA)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    let expenses = JSON.parse(localStorage.getItem('shop_expenses')) || [];

    function updateUI() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let total = 0;

        expenses.forEach((item, index) => {
            total += parseFloat(item.price);
            tbody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${item.name}</td>
                    <td>${Number(item.price).toLocaleString()}</td>
                    <td><button class="del-btn" onclick="deleteItem(${index})">سڕینەوە</button></td>
                </tr>
            `;
        });

        document.getElementById('totalAmount').innerText = total.toLocaleString() + ' دینار';
        localStorage.setItem('shop_expenses', JSON.stringify(expenses));
    }

    function addItem() {
        const name = document.getElementById('itemName').value.trim();
        const price = document.getElementById('itemPrice').value;

        if (!name || !price || price <= 0) {
            alert('تکایە ناوی کەرەستە و نرخەکەی بنووسە!');
            return;
        }

        expenses.push({ name, price: parseFloat(price) });
        document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = '';
        updateUI();
    }

    function deleteItem(index) {
        if(confirm('دڵنیایت لە سڕینەوە؟')) {
            expenses.splice(index, 1);
            updateUI();
        }
    }

    updateUI();
</script>
</body>
</html>
